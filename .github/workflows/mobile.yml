name: Build mobile bundles
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: '새 빌드 번호 (이전 배포보다 큰 양의 정수, 최대 2100000000)'
        required: true
        type: string
        default: '26'
permissions:
  contents: read
env:
  VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
  VITE_COMMUNITY_EMAIL_CODE: ${{ vars.VITE_COMMUNITY_EMAIL_CODE }}
  VITE_COMMUNITY_SIGNUPS_READY: ${{ vars.VITE_COMMUNITY_SIGNUPS_READY }}
concurrency:
  group: mobile-bundles
  cancel-in-progress: false
jobs:
  validate-version:
    runs-on: ubuntu-latest
    outputs:
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      - name: Validate the shared mobile build number
        id: version
        env:
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          value = os.environ['INPUT_VERSION_CODE']
          if not re.fullmatch(r'[1-9][0-9]{0,9}', value) or int(value) > 2100000000:
            raise SystemExit('version_code must be an integer from 1 to 2100000000 without leading zeros')
          with pathlib.Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
            output.write(f'version_code={value}\n')
          PY
  android:
    needs: validate-version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SKYLOG_VERSION_CODE: ${{ needs.validate-version.outputs.version_code }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      - run: pnpm mobile:sync
      - run: bash gradlew :app:bundleRelease :app:assembleRelease :app:lintRelease --no-daemon
        working-directory: android
      - name: Check offline assets and bundle metadata
        run: |
          python3 - <<'PY'
          import zipfile, pathlib, hashlib, json, os, subprocess
          version = json.loads(pathlib.Path('package.json').read_text())['version']
          p = pathlib.Path('android/app/build/outputs/bundle/release/app-release.aab')
          with zipfile.ZipFile(p) as z:
            names = z.namelist()
            for f in ['index.html','data/stars-deep.v1.bin','data/manifest.v1.json','landscapes/meadow-v2.webp']:
              assert 'base/assets/public/'+f in names, f
            assert any('/data/learn/' in n for n in names)
            assert any('/data/content/' in n for n in names)
            assert '/skylog/assets/' not in z.read('base/assets/public/index.html').decode()
          pathlib.Path('android/app/build/outputs/bundle/release/build-info.json').write_text(json.dumps({'commit':os.environ['GITHUB_SHA'],'versionCode':os.environ['SKYLOG_VERSION_CODE'],'signature':'unsigned; sign locally with the upload key','sha256':hashlib.sha256(p.read_bytes()).hexdigest()}, indent=2))
          apk = pathlib.Path('android/app/build/outputs/apk/release/app-release-unsigned.apk')
          aapt = pathlib.Path(os.environ['ANDROID_HOME']) / 'build-tools/36.0.0/aapt2'
          badging = subprocess.check_output([str(aapt), 'dump', 'badging', str(apk)], text=True)
          assert f"versionName='{version}'" in badging, 'APK version name differs from package.json'
          assert f"versionCode='{os.environ['SKYLOG_VERSION_CODE']}'" in badging, 'APK build number differs'
          with zipfile.ZipFile(p) as bundle, zipfile.ZipFile(apk) as install:
            for name in bundle.namelist():
              if name.startswith('base/assets/public/') and not name.endswith('/'):
                assert bundle.read(name) == install.read(name.removeprefix('base/')), name
            manifest = pathlib.Path('public/object-photos/v1/manifest.json').read_bytes()
            assert bundle.read('base/assets/public/object-photos/v1/manifest.json') == manifest
            for photo in json.loads(manifest)['photos']:
              for size in ['hero', 'thumb']:
                asset = photo[size]
                image = bundle.read('base/assets/public/' + asset['path'])
                assert len(image) == asset['bytes'], asset['path']
                assert hashlib.sha256(image).hexdigest() == asset['sha256'], asset['path']
          apk.with_name('build-info.json').write_text(json.dumps({'commit':os.environ['GITHUB_SHA'],'versionCode':os.environ['SKYLOG_VERSION_CODE'],'signature':'unsigned; an update needs the SAME certificate as the installed APK','sha256':hashlib.sha256(apk.read_bytes()).hexdigest()}, indent=2))
          PY
      - name: Read the public certificate of the previous personal-test APK
        run: |
          curl --fail --location --retry 2 --max-time 120 -o /tmp/skylog-build9.apk https://github.com/JunhyoungPark-NOBEL/skylog/releases/download/v0.1.0-beta.4-build9/skylog-0.1.0-beta.4-build9-local-test.apk
          echo 'efdfca31d55dfeb707d7d914b1a404bb14cb8d543b52f6f3549d4a4db75e761f  /tmp/skylog-build9.apk' | sha256sum -c -
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs /tmp/skylog-build9.apk > android/app/build/outputs/apk/release/build9-certificate.txt
      - uses: actions/upload-artifact@v7
        with:
          name: skylog-android-apk-unsigned
          path: android/app/build/outputs/apk/release/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: skylog-android-aab-unsigned
          path: android/app/build/outputs/bundle/release/
          if-no-files-found: error
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: adb shell svc wifi disable && adb shell svc data disable && cd android && bash gradlew :app:connectedDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-lint
          path: |
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
  ios:
    needs: validate-version
    runs-on: macos-15
    timeout-minutes: 35
    env:
      SKYLOG_VERSION_CODE: ${{ needs.validate-version.outputs.version_code }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Select Xcode 26
        run: |
          XCODE=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)
          test -n "$XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
      - run: pnpm install --frozen-lockfile
      - run: pnpm mobile:sync
      - name: Compile iOS without distribution credentials
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -derivedDataPath ios/DerivedData CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION="$SKYLOG_VERSION_CODE" build > ios-build.log 2>&1 || { tail -120 ios-build.log; exit 1; }
          python3 - <<'PY'
          import pathlib, hashlib, json
          public = pathlib.Path('ios/DerivedData/Build/Products/Release-iphoneos/App.app/public')
          manifest = pathlib.Path('public/object-photos/v1/manifest.json').read_bytes()
          assert (public / 'object-photos/v1/manifest.json').read_bytes() == manifest
          for photo in json.loads(manifest)['photos']:
            for size in ['hero', 'thumb']:
              asset = photo[size]
              image = (public / asset['path']).read_bytes()
              assert len(image) == asset['bytes'], asset['path']
              assert hashlib.sha256(image).hexdigest() == asset['sha256'], asset['path']
          PY
          ditto -c -k --keepParent ios/DerivedData/Build/Products/Release-iphoneos/App.app ios/skylog-ios-unsigned.zip
      - uses: actions/upload-artifact@v7
        with:
          name: skylog-ios-unsigned-build
          path: ios/skylog-ios-unsigned.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-build-log
          path: ios-build.log
