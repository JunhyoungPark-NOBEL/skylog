name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        # 버전은 package.json의 packageManager 필드에서 읽는다.

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm data:content
      - run: pnpm data:learn
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: node tests/backend/community.test.mjs
      - run: pnpm build
        env:
          # 저장소 이름이 바뀌어도 base가 따라가게 한다 (vite.config.ts VITE_BASE).
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_COMMUNITY_EMAIL_CODE: ${{ vars.VITE_COMMUNITY_EMAIL_CODE }}
          VITE_COMMUNITY_SIGNUPS_READY: ${{ vars.VITE_COMMUNITY_SIGNUPS_READY }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
