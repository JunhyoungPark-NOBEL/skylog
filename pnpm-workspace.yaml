# pnpm 10+: dependencies allowed to run install/postinstall scripts.
# Anything not listed here is installed with its build scripts skipped (ERR_PNPM_IGNORED_BUILDS otherwise).
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - '@supabase/auth-js@2.116.0'
  - '@supabase/functions-js@2.116.0'
  - '@supabase/postgrest-js@2.116.0'
  - '@supabase/realtime-js@2.116.0'
  - '@supabase/storage-js@2.116.0'
  - '@supabase/supabase-js@2.116.0'
