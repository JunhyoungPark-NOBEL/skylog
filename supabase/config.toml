project_id = "skylog"
[functions.community]
verify_jwt = false

[auth]
additional_redirect_urls = []
site_url = "https://junhyoungpark-nobel.github.io/skylog/"

[auth.email]
enable_confirmations = true
max_frequency = "1m0s"
otp_length = 8

[auth.email.template.confirmation]
subject = "별관찰해쌀뚜 · 로그인 인증번호 / Your sign-in code"
content_path = "./supabase/templates/otp.html"

[auth.email.template.magic_link]
subject = "별관찰해쌀뚜 · 로그인 인증번호 / Your sign-in code"
content_path = "./supabase/templates/otp.html"

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[db.pooler]
default_pool_size = 15
max_client_conn = 200

[storage.analytics]
enabled = true
max_namespaces = 10

[storage.image_transformation]
enabled = true
